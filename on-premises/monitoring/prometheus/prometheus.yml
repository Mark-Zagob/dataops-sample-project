# ============================================================================
# PROMETHEUS CONFIGURATION
# ============================================================================
# Mục tiêu:
# - Scrape infra, container, DB exporters và custom data plane metrics.
# - Đánh giá alert rules.
# - Gửi alert sang Alertmanager.
#
# Production note:
# - scrape_interval càng ngắn càng tốn resource.
# - Data plane query nặng không nên scrape 10s/lần.
# ============================================================================

global:
  # Infra/control plane có thể scrape 30s.
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

# Alert rules được tách thành file để dễ review trong Git.
rule_files:
  - /etc/prometheus/rules/*.yml

# Prometheus không trực tiếp dựng người.
# Alertmanager làm nhiệm vụ routing/notification.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  # --------------------------------------------------------------------------
  # Prometheus tự giám sát chính nó.
  # --------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # --------------------------------------------------------------------------
  # Host metrics
  # --------------------------------------------------------------------------
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  # --------------------------------------------------------------------------
  # Container metrics
  # --------------------------------------------------------------------------
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  # --------------------------------------------------------------------------
  # MySQL Source
  # --------------------------------------------------------------------------
  - job_name: mysqld-source
    static_configs:
      - targets:
          - mysqld-exporter-source:9104

  # --------------------------------------------------------------------------
  # PostgreSQL Target / Data Plane
  # --------------------------------------------------------------------------
  # Data plane queries có thể nặng hơn, nên scrape 5 phút/lần.
  # Với lab nhỏ thì 5 phút là an toàn và đủ để học SLO/freshness.
  - job_name: postgres-target
    scrape_interval: 5m
    scrape_timeout: 30s
    static_configs:
      - targets:
          - postgres-exporter-target:9187

  # --------------------------------------------------------------------------
  # Dagster Metadata / Control Plane
  # --------------------------------------------------------------------------
  # Control Plane cần phát hiện nhanh hơn, nên scrape 30s.
  - job_name: postgres-metadata
    static_configs:
      - targets:
          - postgres-exporter-metadata:9187

  # --------------------------------------------------------------------------
  # Pushgateway - Pipeline-emitted Metrics
  # --------------------------------------------------------------------------
  # WHY SEPARATE JOB?
  # - Metrics từ Pushgateway có lifecycle khác với metrics từ exporter:
  #   + Exporter: stateless, mỗi scrape là fresh data
  #   + Pushgateway: stateful, giữ metric cho đến khi bị overwrite
  # - Scrape interval có thể dài hơn (1m) vì:
  #   + Metric chỉ thay đổi khi pipeline chạy xong (batch job)
  #   + Không cần realtime như infra metrics
  #
  # HONOR_LABELS: TRUE
  # - Giữ nguyên labels từ pipeline (pipeline_name, run_id, etc.)
  # - KHÔNG override bằng instance="pushgateway:9091", job="pushgateway"
  # - Cho phép query: dagster_pipeline_data_age_hours{pipeline_name="orders"}
  # - Nếu để honor_labels: false, labels gốc sẽ bị chuyển thành exported_*
  #   → khó query và group by pipeline_name
  #
  # STALE METRICS RISK:
  # - Pushgateway giữ metric cũ mãi mãi nếu pipeline ngừng chạy
  # - Giải pháp: dùng alert "PipelineNoRecentRun" để catch
  # - Hoặc dùng pushgateway API DELETE để reset metric cũ
  - job_name: pushgateway
    scrape_interval: 1m
    scrape_timeout: 30s
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091