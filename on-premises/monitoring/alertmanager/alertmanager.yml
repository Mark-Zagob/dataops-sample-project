# ============================================================================
# ALERTMANAGER CONFIGURATION
# ============================================================================
# Mục tiêu:
# - Group alert để tránh spam.
# - Route critical và warning riêng.
# - Cung cấp chỗ để gắn Slack/Email/PagerDuty sau này.
#
# Hiện tại:
# - Dùng webhook placeholder.
# - Bạn có thể thay bằng Slack receiver, email receiver hoặc PagerDuty.
# ============================================================================

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - severity
    - layer
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      # Thay bằng receiver thật của bạn.
      # Nếu chưa có receiver, có thể comment webhook_configs và chỉ dùng Alertmanager UI.
      - url: 'http://host.docker.internal:5001/'
        send_resolved: true

  - name: critical
    webhook_configs:
      # Critical route riêng để sau này gắn kênh on-call.
      - url: 'http://host.docker.internal:5001/'
        send_resolved: true