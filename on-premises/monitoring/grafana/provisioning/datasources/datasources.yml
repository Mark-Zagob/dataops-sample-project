# ============================================================================
# GRAFANA DATASOURCE PROVISIONING
# ============================================================================
# Production-grade principle:
# - Datasource được quản lý bằng file, không click tay.
# - Có thể reproduce lại môi trường.
# ============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s