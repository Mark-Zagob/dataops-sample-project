# ============================================================================
# POSTGRES EXPORTER CUSTOM QUERIES - TARGET DATA PLANE (LIGHTWEIGHT ONLY)
# ============================================================================
# Mục tiêu:
# - Chỉ giữ lại lightweight queries KHÔNG ảnh hưởng performance
# - KHÔNG query trực tiếp lên bảng production nặng
# - Data quality, row count, data age giờ do PIPELINE EMIT qua Pushgateway
#
# ARCHITECTURE CHANGE (Phase 1 - SRE Optimization):
# - TRƯỚC: Prometheus scrape postgres-exporter → SELECT COUNT(*) FROM orders_production
#   → Heavy queries, Noisy Neighbor, giết DB production khi scale
# - SAU: Pipeline tự tính metric → Push lên Pushgateway
#   → Data Plane KHÔNG BỊ CHẠM bởi monitoring
#   → Blast radius: Pushgateway down → chỉ mất metric, DB vẫn OK
#
# LIGHTWEIGHT QUERIES (giữ lại):
# - production_exists: chỉ query pg_catalog.pg_tables (catalog, không phải data)
# - backup_count: chỉ query pg_catalog.pg_tables
# - staging_orphan_count: chỉ query pg_catalog.pg_tables LIKE pattern
#
# HEAVY QUERIES (đã chuyển sang Pushgateway):
# - orders_health_data_age_hours: pipeline tự tính từ MAX(created_at)
# - orders_row_count: pipeline tự đếm khi load staging
# - orders_quality_*: pipeline tự check trên staging trước khi swap
#
# Production note:
# - File này giờ chỉ chứa metadata queries, không chứa data queries
# - Nếu cần debug, có thể query trực tiếp DB (không qua exporter)
# ============================================================================

orders_health_metadata:
  # QUERY: Chỉ kiểm tra trạng thái metadata của data plane
  # - production_exists: bảng orders_production có tồn tại không
  # - backup_count: số bảng backup (nên chỉ có 1)
  # - staging_orphan_count: số bảng staging orphan (nên = 0 khi không có run)
  #
  # WHY LIGHTWEIGHT?
  # - Query pg_catalog.pg_tables (system catalog)
  # - KHÔNG scan data rows
  # - Trả về ngay lập tức, không tốn IOPS
  query: |
    SELECT
      monitoring.orders_production_exists() AS production_exists,
      (
        SELECT COUNT(*)
        FROM pg_catalog.pg_tables
        WHERE schemaname = 'public'
          AND tablename = 'orders_production_backup'
      ) AS backup_count,
      (
        SELECT COUNT(*)
        FROM pg_catalog.pg_tables
        WHERE schemaname = 'public'
          AND tablename LIKE 'orders_stg_%'
      ) AS staging_orphan_count
  metrics:
    - production_exists:
        usage: "GAUGE"
        description: "1 if orders_production exists, 0 otherwise"
    - backup_count:
        usage: "GAUGE"
        description: "Number of orders_production_backup tables (should be 0 or 1)"
    - staging_orphan_count:
        usage: "GAUGE"
        description: "Number of run-scoped staging tables currently present (should be 0 when no run active)"
