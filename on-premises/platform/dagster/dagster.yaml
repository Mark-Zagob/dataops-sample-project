# =================================================================
# DAGSTER INSTANCE CONFIGURATION
# =================================================================
# Production-grade lab:
# - Run storage: PostgreSQL
# - Event log storage: PostgreSQL
# - Schedule storage: PostgreSQL
#
# Mục tiêu:
# - Hỗ trợ concurrent access tốt hơn SQLite
# - Dễ backup/restore metadata DB
# - Phù hợp cho multi-user và vận hành production hơn
# - Control Plane state được đặt trong một database riêng
# =================================================================

run_storage:
  module: dagster_postgres.storage.runs
  class: PostgresRunStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_METADATA_HOST
      username:
        env: DAGSTER_METADATA_USER
      password:
        env: DAGSTER_METADATA_PASSWORD
      database:
        env: DAGSTER_METADATA_DB
      port: 5432

event_log_storage:
  module: dagster_postgres.storage.event_log
  class: PostgresEventLogStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_METADATA_HOST
      username:
        env: DAGSTER_METADATA_USER
      password:
        env: DAGSTER_METADATA_PASSWORD
      database:
        env: DAGSTER_METADATA_DB
      port: 5432

schedule_storage:
  module: dagster_postgres.storage.schedules
  class: PostgresScheduleStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_METADATA_HOST
      username:
        env: DAGSTER_METADATA_USER
      password:
        env: DAGSTER_METADATA_PASSWORD
      database:
        env: DAGSTER_METADATA_DB
      port: 5432

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher