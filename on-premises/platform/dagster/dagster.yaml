# =================================================================
# DAGSTER INSTANCE CONFIGURATION
# =================================================================
# Production-grade lab:
# - Run storage: PostgreSQL
# - Event log storage: PostgreSQL
# - Schedule storage: PostgreSQL
# - Run coordinator: QueuedRunCoordinator
#
# Compatible với dagster-postgres==0.26.2
# =================================================================

run_storage:
  module: dagster_postgres.storage
  class: PostgresRunStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_METADATA_HOST
      username:
        env: DAGSTER_METADATA_USER
      password:
        env: DAGSTER_METADATA_PASSWORD
      db_name:
        env: DAGSTER_METADATA_DB
      port: 5432

event_log_storage:
  module: dagster_postgres.storage
  class: PostgresEventLogStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_METADATA_HOST
      username:
        env: DAGSTER_METADATA_USER
      password:
        env: DAGSTER_METADATA_PASSWORD
      db_name:
        env: DAGSTER_METADATA_DB
      port: 5432

schedule_storage:
  module: dagster_postgres.storage
  class: PostgresScheduleStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_METADATA_HOST
      username:
        env: DAGSTER_METADATA_USER
      password:
        env: DAGSTER_METADATA_PASSWORD
      db_name:
        env: DAGSTER_METADATA_DB
      port: 5432

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# =================================================================
# RUN COORDINATOR: SINGLE-FLIGHT EXECUTION
# =================================================================
# max_concurrent_runs: 1 đảm bảo chỉ có 1 run được chạy tại một thời điểm.
# Các run khác sẽ ở trạng thái QUEUED và được daemon dequeue sau.
#
# Đây là lựa chọn an toàn cho lab hiện tại vì chỉ có 1 pipeline orders.
# Khi có nhiều pipeline, ta sẽ chuyển sang tag_concurrency_limits.
# =================================================================
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1
    dequeue_interval_seconds: 5

    # -------------------------------------------------------------
    # FUTURE: Per-pipeline single-flight
    # -------------------------------------------------------------
    # Khi có nhiều pipeline và muốn giới hạn theo từng pipeline:
    #
    # max_concurrent_runs: 5
    # tag_concurrency_limits:
    #   - key: pipeline
    #     value: orders
    #     limit: 1
    #
    # Lưu ý: tag-based limit chỉ hoạt động chắc chắn khi run được tạo
    # với tag phù hợp, ví dụ chạy qua job/schedule có tag.
    # Với manual Materialize từ UI, cần thận trọng hơn.
    # -------------------------------------------------------------