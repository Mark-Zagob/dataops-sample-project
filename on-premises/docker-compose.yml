# =================================================================
# NETWORKS: Tạo mạng nội bộ riêng biệt
# =================================================================
# Tất cả services sẽ giao tiếp với nhau qua mạng này.
# Không service nào bị lộ ra ngoài internet trừ khi chúng ta mở port.
networks:
  dataops-network:
    external: true

# =================================================================
# VOLUMES: Lưu trữ bền vững cho Databases
# =================================================================
# Named volumes giúp dữ liệu không bị mất khi restart container.
# Đây là yêu cầu BẮT BUỘC cho Stateful Services (DB).
volumes:
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  dagster_storage:
    driver: local

# =================================================================
# SERVICES
# =================================================================
services:

  # ---------------------------------------------------------------
  # 1. SOURCE LAYER: MySQL (Giả lập DB Kinh doanh)
  # ---------------------------------------------------------------
  mysql-source:
    image: mysql:8.0
    container_name: dataops-mysql-source
    restart: always
    networks:
      - dataops-network
    environment:
      # Trong production thực tế, KHÔNG hardcode password như thế này.
      # Chúng ta sẽ dùng file .env (xem phần hướng dẫn bên dưới).
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales_db}
      MYSQL_USER: ${MYSQL_USER:-datauser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-datapassword}
    volumes:
      # Gắn volume để lưu data. Nếu không có dòng này, mọi insert/update
      # sẽ mất sạch khi container restart.
      - mysql_data:/var/lib/mysql
      # [MỚI] Mount seed data script vào thư mục init của MySQL
      # Docker sẽ tự động chạy file này khi container được tạo lần đầu
      - ./seed_data/mysql_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Mở port 3306 để bạn có thể dùng DBeaver/MySQL Workbench 
      # kết nối vào xem data test (chỉ dùng trong lab).
      - "3306:3306"
    healthcheck:
      # SRE LENS: Kiểm tra MySQL đã THỰC SỰ sẵn sàng chưa.
      # Lệnh này chạy bên trong container. Nếu exit code != 0, 
      # Docker sẽ đánh dấu container là "unhealthy".
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------
  # 2. STORAGE LAYER: PostgreSQL (Data Warehouse Target)
  # ---------------------------------------------------------------
  postgres-target:
    image: postgres:15-alpine
    container_name: dataops-postgres-target
    restart: always
    networks:
      - dataops-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datawarehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwhpassword}
      POSTGRES_DB: ${POSTGRES_DB:-analytics_dwh}
    volumes:
      # Lưu trữ bền vững cho Data Warehouse.
      - postgres_data:/var/lib/postgresql/data
      # [MỚI] Mount seed data script vào thư mục init của PostgreSQL
      - ./seed_data/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Mở port 5432 để debug/check data sau khi ETL chạy.
      - "5432:5432"
    healthcheck:
      # SRE LENS: pg_isready là lệnh chuẩn để check Postgres đã nhận kết nối chưa.
      test: ["CMD-SHELL", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------
  # 3. CONTROL PLANE & PROCESSING: Dagster Platform
  # ---------------------------------------------------------------
  # Đây là "bộ não" của hệ thống.
  # PRODUCTION GRADE: Chúng ta BUILD image từ Dockerfile, 
  # COPY code vào trong image. KHÔNG mount volume từ host.
  dagster-platform:
    build:
      context: .                          # Build context là thư mục gốc project
      dockerfile: ./platform/dagster/Dockerfile  # Đường dẫn đến Dockerfile
    container_name: dataops-dagster-platform
    restart: always
    networks:
      - dataops-network
    environment:
      # Truyền thông tin kết nối DB vào container.
      # Dagster code sẽ đọc các biến môi trường này để connect.
      MYSQL_HOST: mysql-source
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales_db}
      MYSQL_USER: ${MYSQL_USER:-datauser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-datapassword}
      
      POSTGRES_HOST: postgres-target
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB:-analytics_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-datawarehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwhpassword}
      
      # Cấu hình Dagster Storage (nơi lưu lịch sử chạy, logs...)
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      # Volume cho Dagster internal storage (logs, run history).
      # Không liên quan đến source code, chỉ lưu trạng thái vận hành.
      - dagster_storage:/opt/dagster/dagster_home
      
      # ============================================================
      # DEV MODE TOGGLE (Chỉ dùng khi muốn code nhanh)
      # ============================================================
      # Nếu bạn muốn sửa code Python và thấy thay đổi ngay lập tức 
      # mà không cần build lại image, hãy UNCOMMENT 2 dòng dưới đây 
      # và COMMENT dòng "build:" ở trên lại.
      # Nhưng hãy nhớ: Đây là cách làm DEV, không phải PRODUCTION.
      #
      # - ./user_code:/opt/dagster/user_code
      # - ./platform:/opt/dagster/platform
    ports:
      # Port 3000: Truy cập Dagster UI (Dagit) từ trình duyệt máy host.
      # Mở trình duyệt và vào http://localhost:3000 để xem pipeline.
      - "3000:3000"
    depends_on:
      # SRE LENS: Chờ đến khi MySQL và Postgres thực sự HEALTHY 
      # (pass healthcheck) thì Dagster mới được khởi động.
      # Nếu chỉ dùng "depends_on: mysql-source" không thôi, 
      # Dagster sẽ chạy ngay khi container MySQL vừa start, 
      # lúc đó DB chưa kịp init -> Connection Refused.
      mysql-source:
        condition: service_healthy
      postgres-target:
        condition: service_healthy