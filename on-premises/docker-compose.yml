# =================================================================
# NETWORKS: Tạo mạng nội bộ riêng biệt
# =================================================================
networks:
  dataops-network:
    driver: bridge

# =================================================================
# VOLUMES: Lưu trữ bền vững cho Databases và Dagster state
# =================================================================
volumes:
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  dagster_storage:
    driver: local
  dagster_metadata_data:
    driver: local

# =================================================================
# SERVICES
# =================================================================
services:
  # ---------------------------------------------------------------
  # 1. SOURCE LAYER: MySQL
  # ---------------------------------------------------------------
  mysql-source:
    image: mysql:8.0
    container_name: dataops-mysql-source
    restart: always
    networks:
      - dataops-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales_db}
      MYSQL_USER: ${MYSQL_USER:-datauser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-datapassword}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./seed_data/mysql_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 600s

  # ---------------------------------------------------------------
  # 2. STORAGE LAYER: PostgreSQL Target
  # ---------------------------------------------------------------
  postgres-target:
    image: postgres:15-alpine
    container_name: dataops-postgres-target
    restart: always
    networks:
      - dataops-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datawarehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwhpassword}
      POSTGRES_DB: ${POSTGRES_DB:-analytics_dwh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed_data/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ---------------------------------------------------------------
  # 3. CONTROL PLANE METADATA: PostgreSQL cho Dagster
  # ---------------------------------------------------------------
  dagster-metadata:
    image: postgres:15-alpine
    container_name: dataops-dagster-metadata
    restart: always
    networks:
      - dataops-network
    environment:
      POSTGRES_USER: ${DAGSTER_METADATA_USER:-dagster_metadata}
      POSTGRES_PASSWORD: ${DAGSTER_METADATA_PASSWORD:-metadata_password_change_me}
      POSTGRES_DB: ${DAGSTER_METADATA_DB:-dagster_metadata}
    volumes:
      - dagster_metadata_data:/var/lib/postgresql/data
    # Nếu cần debug bằng DBeaver/pgAdmin từ host, tạm uncomment:
    # ports:
    #   - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------
  # 4. CONTROL PLANE: Dagster Webserver/UI
  # ---------------------------------------------------------------
  dagster-platform:
    build:
      context: .
      dockerfile: ./platform/dagster/Dockerfile
    container_name: dataops-dagster-platform
    restart: always
    networks:
      - dataops-network
    environment:
      # Source DB
      MYSQL_HOST: mysql-source
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales_db}
      MYSQL_USER: ${MYSQL_USER:-datauser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-datapassword}

      # Target DB
      POSTGRES_HOST: postgres-target
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB:-analytics_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-datawarehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwhpassword}

      # Dagster home
      DAGSTER_HOME: /opt/dagster/dagster_home

      # Dagster metadata PostgreSQL
      DAGSTER_METADATA_HOST: dagster-metadata
      DAGSTER_METADATA_PORT: 5432
      DAGSTER_METADATA_USER: ${DAGSTER_METADATA_USER:-dagster_metadata}
      DAGSTER_METADATA_PASSWORD: ${DAGSTER_METADATA_PASSWORD:-metadata_password_change_me}
      DAGSTER_METADATA_DB: ${DAGSTER_METADATA_DB:-dagster_metadata}
    volumes:
      # Volume cho local state nếu Dagster cần ghi local
      - dagster_storage:/opt/dagster/dagster_home

      # Bind mount config read-only để tránh volume cũ che file config trong image
      - ./platform/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./platform/dagster/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      dagster-metadata:
        condition: service_healthy
      mysql-source:
        condition: service_healthy
      postgres-target:
        condition: service_healthy

  # ---------------------------------------------------------------
  # 5. CONTROL PLANE: Dagster Daemon
  # ---------------------------------------------------------------
  dagster-daemon:
    build:
      context: .
      dockerfile: ./platform/dagster/Dockerfile
    container_name: dataops-dagster-daemon
    restart: always
    networks:
      - dataops-network
    environment:
      # Source DB
      MYSQL_HOST: mysql-source
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales_db}
      MYSQL_USER: ${MYSQL_USER:-datauser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-datapassword}

      # Target DB
      POSTGRES_HOST: postgres-target
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB:-analytics_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-datawarehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwhpassword}

      # Dagster home
      DAGSTER_HOME: /opt/dagster/dagster_home

      # Dagster metadata PostgreSQL
      DAGSTER_METADATA_HOST: dagster-metadata
      DAGSTER_METADATA_PORT: 5432
      DAGSTER_METADATA_USER: ${DAGSTER_METADATA_USER:-dagster_metadata}
      DAGSTER_METADATA_PASSWORD: ${DAGSTER_METADATA_PASSWORD:-metadata_password_change_me}
      DAGSTER_METADATA_DB: ${DAGSTER_METADATA_DB:-dagster_metadata}
    volumes:
      # Volume cho local state nếu Dagster cần ghi local
      - dagster_storage:/opt/dagster/dagster_home

      # Bind mount config read-only để tránh volume cũ che file config trong image
      - ./platform/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./platform/dagster/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
    depends_on:
      dagster-metadata:
        condition: service_healthy
      mysql-source:
        condition: service_healthy
      postgres-target:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/dagster_home/workspace.yaml"]